services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_crm
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    build: .
    command: python run_web.py
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
  bot:
    build: .
    command: python run_bot.py
    env_file: .env
    depends_on:
      - db
volumes:
  db_data:
